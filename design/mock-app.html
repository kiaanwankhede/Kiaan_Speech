<title>Kiaan Speech Mock App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>
/* Layout: tablet app. Sidebar navigation on wide screens, a top bar with scrolling tabs on phones.
   Kid mode takes over the whole screen and keeps one calm light look whatever the device theme. */
:root {
  --bg: #F2F6F8;
  --surface: #FFFFFF;
  --surface-2: #E7EEF2;
  --ink: #16202B;
  --muted: #566374;
  --rule: #D4DCE4;
  --accent: #1B6683;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFEDF3;
  --mark: #A86A12;
  --mark-soft: #FAEFD9;
  --ok: #2B7A4B;
  --ok-soft: #E2F2E8;
  --warn: #9E4A17;
  --warn-soft: #FBE8DA;
  --danger: #B3261E;
  --danger-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(22, 32, 43, 0.08);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --surface: #161D26; --surface-2: #1D2631; --ink: #E5EAF0; --muted: #9AA7B5; --rule: #2A3542;
    --accent: #72BAD6; --accent-ink: #0B1A21; --accent-soft: #15303B; --mark: #E2B159; --mark-soft: #2E2410;
    --ok: #74C79A; --ok-soft: #14301F; --warn: #F0A06A; --warn-soft: #36210F; --danger: #F28B82; --danger-ink: #2A0B08;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --surface: #161D26; --surface-2: #1D2631; --ink: #E5EAF0; --muted: #9AA7B5; --rule: #2A3542;
  --accent: #72BAD6; --accent-ink: #0B1A21; --accent-soft: #15303B; --mark: #E2B159; --mark-soft: #2E2410;
  --ok: #74C79A; --ok-soft: #14301F; --warn: #F0A06A; --warn-soft: #36210F; --danger: #F28B82; --danger-ink: #2A0B08;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); text-wrap: balance; margin: 0; }
h1 { font-size: 1.65rem; line-height: 1.2; }
h2 { font-size: 1.12rem; line-height: 1.3; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h3 { font-size: 1rem; line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); }
.hint { color: var(--muted); font-size: 0.95rem; max-width: 66ch; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.view-head + .hint { margin-bottom: 18px; }

/* Site shell */
.site { max-width: 1240px; margin: 0 auto; display: flex; gap: 28px; padding-block: 16px 64px; }
.side { flex: none; width: 214px; position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: flex-start; display: flex; flex-direction: column; gap: 14px; }
.side-top { display: flex; flex-direction: column; gap: 10px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; text-decoration: none; color: var(--ink); }
.brand small { display: block; font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 700; white-space: nowrap; }
.nav a svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav .count { margin-left: auto; font-size: 0.75rem; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 1px 7px; }
.drive { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 5px 10px; border-radius: 999px; align-self: flex-start; }
.drive svg { width: 15px; height: 15px; }
.main-col { flex: 1; min-width: 0; }
.proto { font-size: 0.84rem; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 7px 12px; margin-bottom: 18px; }
@media (max-width: 899px) {
  .site { flex-direction: column; gap: 10px; padding-block: 10px 48px; }
  .side { position: static; width: auto; gap: 10px; }
  .side-top { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
  .nav a { flex: none; min-height: 40px; padding: 0 12px; }
  .side .side-play { display: none; }
}
@media (min-width: 900px) { .side .top-play { display: none; } }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 52px; font-size: 1.05rem; padding: 0 22px; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: var(--danger-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding: 0 8px; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, .chip:focus-visible, .nav a:focus-visible, .card:focus-visible, .marker:focus-visible, .input:focus-visible, .ex-card:focus-visible, .brand:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 42px; min-width: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip:disabled { opacity: 0.4; cursor: not-allowed; }
.chip.add { border-style: dashed; color: var(--accent); }
.chip.small { min-height: 34px; padding: 0 12px; font-size: 0.9rem; }
.input { min-height: 44px; border: 1px solid var(--rule); border-radius: 10px; padding: 0 12px; font: inherit; background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; font-weight: 700; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.later { background: var(--mark-soft); color: var(--mark); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.panel-box { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Home */
.home-grid { display: grid; gap: 16px; }
@media (min-width: 760px) { .home-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }
.next-up { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.next-up h2 { color: var(--accent-ink); font-size: 1.5rem; }
.next-up p { opacity: 0.9; }
.next-up .btn { align-self: flex-start; background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.85rem; }
.todo { display: flex; flex-direction: column; gap: 8px; }
.todo a { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink); text-decoration: none; font-weight: 700; }
.todo a:hover { background: var(--accent-soft); }
.mini-ex { display: flex; flex-wrap: wrap; gap: 8px; }
.mini-ex span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule); font-weight: 700; font-size: 0.9rem; }

/* Photos */
.filters { margin: 0 0 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); color: inherit; font: inherit; overflow: hidden; cursor: pointer; min-width: 0; text-decoration: none; }
.card:hover { border-color: var(--accent); }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); overflow: hidden; }
.thumb svg, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; }
.card-who { font-weight: 700; line-height: 1.3; }
.badge { align-self: flex-start; font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.uses { display: flex; flex-wrap: wrap; gap: 4px; }
.use { font-size: 0.72rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 6px; }
.use.later { background: var(--mark-soft); color: var(--mark); }

/* Label a photo */
.bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.label-grid { display: grid; gap: 18px; }
@media (min-width: 1000px) {
  .label-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .tag-col { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
}
.tag-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tagbox { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); cursor: crosshair; touch-action: manipulation; }
.tagbox svg, .tagbox img { display: block; width: 100%; height: auto; max-width: 100%; }
.tagbox svg { aspect-ratio: 4 / 3; }
.marker { position: absolute; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: 3px solid var(--surface); font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); padding: 0; }
.marker-name { position: absolute; transform: translate(-50%, 26px); background: var(--ink); color: var(--bg); font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
.tap-hint { font-weight: 700; color: var(--accent); }
.steps { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.step { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; font-size: 0.85rem; font-family: var(--font-body); flex: none; }
.status { font-weight: 700; font-size: 0.92rem; color: var(--warn); }
.status.ok { color: var(--ok); }
.face-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding-top: 12px; border-top: 1px solid var(--rule); }
.face-row.pending { color: var(--muted); align-items: center; }
.face-row.pending .num { background: var(--surface-2); color: var(--muted); }
.face-fields { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.inline-add { display: flex; gap: 8px; }
.inline-add .input { flex: 1; min-width: 0; }
.two-col { display: grid; gap: 10px; }
@media (min-width: 560px) { .two-col { grid-template-columns: 1fr 1fr; } }
.use-list { display: flex; flex-direction: column; gap: 4px; }
.use-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--rule); }
.use-row:first-child { border-top: 0; }
.use-row label { display: flex; gap: 10px; align-items: center; font-weight: 700; cursor: pointer; }
.use-row input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.use-row .later-text { color: var(--muted); font-weight: 700; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-weight: 700; color: var(--danger); }

/* People */
.list { display: flex; flex-direction: column; gap: 10px; }
.person { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; flex-wrap: wrap; }
.avatar { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; flex: none; background: var(--surface-2); }
.avatar svg { width: 100%; height: 100%; display: block; }
.person .grow { flex: 1; min-width: 120px; }
.person .grow b { display: block; font-size: 1.05rem; }
.person .grow small { color: var(--muted); font-size: 0.88rem; }
.voice-ok { color: var(--ok); font-weight: 700; font-size: 0.9rem; }
.rec { color: var(--danger); border-color: var(--danger); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.add-person { display: flex; gap: 8px; margin-top: 12px; max-width: 460px; }
.add-person .input { flex: 1; min-width: 0; }

/* Exercises */
.ex-section { margin-top: 22px; }
.ex-section > h2 { margin-bottom: 4px; }
.ex-section > .hint { margin-bottom: 12px; }
.ex-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .ex-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .ex-grid.three { grid-template-columns: 1fr 1fr 1fr; } }
.ex-card { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; color: inherit; text-decoration: none; min-width: 0; }
a.ex-card:hover { border-color: var(--accent); }
.ex-card.later { background: transparent; border-style: dashed; }
.ex-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ex-word { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1; }
.ex-card.later .ex-word { color: var(--muted); }
.ex-meta { font-size: 0.9rem; color: var(--muted); }
.ex-meta b { color: var(--ink); }
.ex-example { font-size: 0.92rem; background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.shared { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-top: 10px; }
.shared div { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; font-size: 0.9rem; color: var(--muted); }
.shared b { display: block; color: var(--ink); font-size: 0.98rem; }

/* Exercise detail */
.current { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 12px; margin: 14px 0 10px; }
@media (min-width: 760px) { .current { grid-template-columns: minmax(0, 280px) minmax(0, 200px) minmax(0, 1fr); align-items: end; gap: 18px; } }
.current p { color: var(--muted); font-size: 0.93rem; }
.levels { display: grid; gap: 14px; margin-top: 14px; }
@media (min-width: 760px) { .levels { grid-template-columns: 1fr 1fr; } }
.level { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.level.is-current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.level.off .level-body { opacity: 0.5; }
.level-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.level-desc { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
.level-body { display: flex; flex-direction: column; gap: 12px; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.track { position: absolute; inset: 0; border-radius: 999px; background: var(--rule); transition: background 0.2s; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); transition: transform 0.2s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(22px); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg-wrap { display: flex; flex-direction: column; gap: 6px; }
.seg-label { font-size: 0.88rem; font-weight: 700; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; min-height: 38px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 9px; font-weight: 700; font-size: 0.9rem; background: var(--surface); }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg input:disabled + span { opacity: 0.45; }
.ready { align-self: flex-start; font-size: 0.86rem; font-weight: 700; padding: 6px 10px; border-radius: 8px; }
.ready.ok { background: var(--ok-soft); color: var(--ok); }
.ready.no { background: var(--warn-soft); color: var(--warn); }
select.input { padding-right: 8px; }

/* Progress */
.prog-grid { display: grid; gap: 16px; margin-top: 16px; }
@media (min-width: 900px) { .prog-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 0.92rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num-cell, th.num-cell { text-align: right; }
tr.new td { background: var(--accent-soft); }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; align-items: center; gap: 10px; font-size: 0.92rem; }
.bar-row b { font-weight: 700; }
.bar-track { height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; display: flex; }
.bar-track i { display: block; height: 100%; }
.bar-track .a { background: var(--ok); }
.bar-track .h { background: var(--mark); }
.bar-row .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.82rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.side-split { display: flex; height: 26px; border-radius: 8px; overflow: hidden; font-size: 0.8rem; font-weight: 700; }
.side-split span { display: grid; place-items: center; color: var(--accent-ink); }
.side-split .l { background: var(--accent); }
.side-split .r { background: color-mix(in srgb, var(--accent) 60%, var(--surface)); color: var(--ink); }

/* Play setup */
.play-setup { display: grid; gap: 16px; }
@media (min-width: 760px) { .play-setup { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); }

/* ---------- Kid mode: one fixed calm palette ---------- */
.kid {
  --k-bg: #EEF3F5; --k-card: #FFFFFF; --k-ink: #1B2530; --k-muted: #6A7684; --k-rule: #CBD6DE;

      }).join("") + "</div>" +
      (cards ? '<div class="grid">' + cards + "</div>" : '<p class="hint">No photos here yet.</p>');

  function viewLabel() {
    var d = UI.draft, u = usage(d);

    var markers = d.faces.map(function (f, i) {

    }).join("");

    var countChips = [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" class="chip" data-action="count" data-n="' + n + '" aria-pressed="' + (d.count === n) + '">' + (n === 5 ? "5+" : n) + "</button>"; }).join("");

        return '<div class="face-row"><span class="num">' + (i + 1) + '</span><div class="face-fields"><div class="chips" role="group" aria-label="Who is face ' + (i + 1) + '?">' + chips +

      ? '<span class="confirm">Delete this photo from Google Drive? <button type="button" class="btn danger solid" data-action="delete-yes">Delete</button><button type="button" class="btn" data-action="delete-no">Keep</button></span>'

      '<div class="step"><h2><span class="num">3</span>Place and things <span class="pill later">For Where and What</span></h2>' +
      '<p class="hint">You can add these now. Where and What will use them when they arrive, with no new upload.</p>' +
      '<div class="two-col"><label class="field" for="lab-place">Place<input class="input" id="lab-place" list="places" data-draft="place" value="' + esc(d.place) + '" placeholder="kitchen, park"></label>' +
      '<label class="field" for="lab-things">Things in the photo<input class="input" id="lab-things" data-draft="things" value="' + esc(d.things) + '" placeholder="plate, ball"></label></div></div>' +

  /* ---------- People ---------- */

    }).join("");
    var bars = D.people.map(function (p) {
      var t = D.trials.filter(function (x) { return x.ex === "who" && x.person === p.id; }).slice(-10);
      var a = t.filter(function (x) { return x.outcome === "alone"; }).length, h = t.filter(function (x) { return x.outcome === "help"; }).length;
      return '<div class="bar-row"><b>' + esc(p.name) + '</b><span class="bar-track" role="img" aria-label="' + a + " on his own, " + h + " with help, out of " + t.length + '"><i class="a" style="width:' + pct(a, t.length) + '%"></i><i class="h" style="width:' + pct(h, t.length) + '%"></i></span><span class="pct">' + a + "/" + t.length + "</span></div>";
    }).join("");
    var two = D.trials.filter(function (x) { return x.n === 2; }).slice(-20);
    var left = two.filter(function (x) { return x.pos === 0; }).length;
    var lp = pct(left, two.length), rp = 100 - lp;
    var bias = Math.max(lp, rp) > 70;
    return '<div class="view-head"><h1>Progress</h1></div><p class="hint">Tracked separately for each exercise. Share this screen with his speech therapist.</p>' +
      '<div class="chips" role="group" aria-label="Exercise">' + EXERCISES.map(function (e) { return '<button type="button" class="chip small" aria-pressed="' + (e.id === "who") + '"' + (e.status === "active" ? "" : " disabled") + ">" + e.word + "</button>"; }).join("") + "</div>" +
      '<div class="prog-grid"><section class="panel-box"><h2>Sessions ' + (readyToMoveUp() ? '<span class="pill ok">Ready to move up</span>' : '<span class="pill info">Level ' + D.who.level + "</span>") + "</h2>" +
      '<div class="table-wrap"><table><thead><tr><th>Day</th><th>Level</th><th class="num-cell">Questions</th><th class="num-cell">On his own</th><th class="num-cell">With help</th><th class="num-cell">Not yet</th></tr></thead><tbody>' + rows + "</tbody></table></div></section>" +
      '<section class="panel-box"><h2>By person</h2><p class="hint">His last 10 answers for each person.</p><div class="bars">' + bars + "</div>" +
      '<div class="legend"><span><i style="background:var(--ok)"></i>On his own</span><span><i style="background:var(--mark)"></i>With help</span></div>' +
      '<h3 style="margin-top:8px">Which side he taps</h3><div class="side-split" role="img" aria-label="Left ' + lp + " percent, right " + rp + ' percent"><span class="l" style="width:' + lp + '%">Left ' + lp + '%</span><span class="r" style="width:' + rp + '%">Right ' + rp + "%</span></div>" +
      '<p class="hint">' + (bias ? "He may be tapping one side out of habit. Try 3 photos." : "No side preference. He is choosing by the person.") + "</p></section></div>";
  }

  /* ---------- Kid mode (shared play engine) ---------- */
  var K = {
    st: null, timers: [],
    setup: function () { K.stop(); K.st = { screen: "setup", ex: "who", level: D.who.level, qIndex: 0, total: D.who.levels[D.who.level].questions, q: null, phase: "ask", wrong: false, lastTarget: null, lastPos: [], results: [] }; },
    later: function (fn, ms) { K.timers.push(setTimeout(fn, ms)); },
    clear: function () { K.timers.forEach(clearTimeout); K.timers = []; },
    stop: function () { K.clear(); try { window.speechSynthesis.cancel(); } catch (e) { /* no voice */ } }
  };
  /* Who exercise: builds a question from the labelled photo library. */
  var WhoExercise = {
    build: function (level) {
      var st = K.st, L = D.who.levels[level];
      if (level === 1) {
        var ones = photosWith("who1");
        var p = rand(ones.filter(function (x) { return x.faces[0].personId !== st.lastTarget; }).length ? ones.filter(function (x) { return x.faces[0].personId !== st.lastTarget; }) : ones);
        return { type: "say", target: p.faces[0].personId, photo: p };
      }
      var useGroup = L.layout === "group" || (L.layout === "mixed" && Math.random() < 0.5);
      var groups = photosWith("whoG" + level);
      if (useGroup && groups.length) return WhoExercise.group(rand(groups), L.ask);
      return WhoExercise.separate(level === 4 ? L.howMany : level, L.ask);
    },
    group: function (p, ask) {
      var faces = p.faces;
      var wantAction = ask === "action" || (ask === "mixed" && Math.random() < 0.5);
      if (wantAction) {
        var unique = faces.filter(function (f) { return f.action && faces.filter(function (g) { return g.action === f.action; }).length === 1; });
        if (unique.length) { var u = rand(unique); return { type: "group", target: u.personId, action: u.action, photo: p }; }
      }
      var pool = faces.filter(function (f) { return f.personId !== K.st.lastTarget; });
      return { type: "group", target: rand(pool.length ? pool : faces).personId, photo: p };
    },
    separate: function (n, ask) {
      var st = K.st, byP = singlesByPerson(), ids = Object.keys(byP);
      var wantAction = ask === "action" || (ask === "mixed" && Math.random() < 0.5);
      var target, targetPhoto, action = "";
      if (wantAction) {
        var withAct = [];
        ids.forEach(function (id) { byP[id].forEach(function (ph) { if (ph.faces[0].action) withAct.push(ph); }); });
        withAct = shuffle(withAct.filter(function (ph) { return ph.faces[0].personId !== st.lastTarget; }));
        for (var i = 0; i < withAct.length && !target; i++) {
          var cand = withAct[i], act = cand.faces[0].action;
          var others = ids.filter(function (id) { return id !== cand.faces[0].personId && byP[id].some(function (ph) { return ph.faces[0].action !== act; }); });
          if (others.length >= n - 1) { target = cand.faces[0].personId; targetPhoto = cand; action = act; }
        }
      }
      if (!target) {
        var pool = ids.filter(function (id) { return id !== st.lastTarget; });
        target = rand(pool.length ? pool : ids); targetPhoto = rand(byP[target]);
      }
      var distract = shuffle(ids.filter(function (id) { return id !== target; })).slice(0, n - 1).map(function (id) {
        var opts = byP[id].filter(function (ph) { return !action || ph.faces[0].action !== action; });
        return { id: id, photo: rand(opts.length ? opts : byP[id]) };
      });
      var order, pos, tries = 0;
      do { order = shuffle([{ id: target, photo: targetPhoto }].concat(distract)); pos = order.map(function (c) { return c.id; }).indexOf(target); tries++; }
      while (tries < 12 && st.lastPos.length >= 2 && st.lastPos[0] === pos && st.lastPos[1] === pos);
      st.lastPos = [pos].concat(st.lastPos).slice(0, 2);
      return { type: "pick", target: target, action: action, choices: order, pos: pos };
    },
    text: function (q) {
      if (q.type === "say") return "Who is this?";
      if (q.action) return "Who is " + q.action + "?";
      return "Show me " + personName(q.target);
    }
  };

  function kidShell() {
    return '<div class="kid"><div class="kid-inner">' +
      (K.st.screen === "setup" ? "" : '<span class="lock-tip">Hold to stop</span>') +
      '<button type="button" class="lock" id="lock" aria-label="Parent lock: hold for 2 seconds"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="3"/><circle class="ring" cx="24" cy="24" r="20"/><rect x="17" y="22" width="14" height="11" rx="2" fill="currentColor"/><path d="M19.5 22v-3a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></button>' +
      '<div id="kscreen">' + kidScreen() + "</div></div></div>";
  }
  function kdots() {
    var st = K.st, h = '<div class="kdots" aria-label="Question ' + Math.min(st.qIndex + 1, st.total) + " of " + st.total + '">';
    for (var i = 0; i < st.total; i++) h += "<i" + (i < st.qIndex || st.screen === "done" ? ' class="done"' : i === st.qIndex ? ' class="now"' : "") + "></i>";
    return h + "</div>";
  }
  function kidScreen() {
    var st = K.st;
    if (st.screen === "setup") {
      var lv = [1, 2, 3, 4].filter(function (n) { return D.who.levels[n].on; }).map(function (n) {
        return '<option value="' + n + '"' + (st.level === n ? " selected" : "") + ">Level " + n + " · " + WHO_LEVELS[n].name + "</option>";
      }).join("");
      return '<div class="kcenter" style="max-width:520px;margin:0 auto;width:100%">' +
        '<p class="for-parent">For you: choose, then hand him the tablet.</p>' +
        '<div class="chips" style="justify-content:center">' + EXERCISES.filter(function (e) { return e.group === "questions"; }).map(function (e) {
          return '<button type="button" class="chip" aria-pressed="' + (e.id === "who") + '"' + (e.status === "active" ? "" : " disabled") + ">" + e.word + (e.status === "active" ? "" : " · later") + "</button>";
        }).join("") + "</div>" +
        '<label class="field" for="k-level" style="width:100%;text-align:left;color:var(--k-muted)">Level<select class="input" id="k-level" style="background:#FFFFFF;color:var(--k-ink);border-color:var(--k-rule)">' + lv + "</select></label>" +
        '<button type="button" class="speak" data-k="start" style="width:150px;height:150px" aria-label="Start">' + '<svg viewBox="0 0 24 24" style="width:64px;height:64px;margin-left:8px" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg></button>' +
        '<p class="for-parent">' + D.who.levels[st.level].questions + " questions · help after " + D.who.helpDelay + ' seconds</p>' +
        '<a class="pbtn" href="#home" style="display:inline-flex;align-items:center;text-decoration:none">Back to parent mode</a></div>';
    }
    if (st.screen === "done") {
      var faces = D.people.slice(0, 3).map(function (p) { return "<span>" + faceSVG(p.look) + "</span>"; }).join("");
      return kdots() + '<div class="kcenter"><div class="done-star">' + I.star + '</div><p class="done-title">All done!</p><div class="faces-row">' + faces + '</div><p class="for-parent">For you: hold the lock for 2 seconds to see how he did.</p></div>';
    }
    var q = st.q, name = personName(q.target);
    var helping = st.phase === "help", acked = st.phase === "ack" || st.phase === "celebrate";
    var cls = helping ? " helping" : acked ? " acked" : "";
    var h = kdots() + '<div class="kq"><button type="button" class="speak" data-k="speak" aria-label="Hear the question again">' + I.speak + '</button><span class="qtext">' + esc(WhoExercise.text(q)) + "</span></div>";
    h += '<p class="ack-line" data-show="' + (st.phase === "ack") + '">' + (st.notYet ? "That’s " : "Yes, ") + esc(name) + "</p><div class=\"kcontent\">";
    if (q.type === "say") {
      h += '<div class="single"><div class="kcard">' + sceneSVG(q.photo.scene) + '</div><p class="name-hint" data-show="' + (helping || st.phase === "ack") + '">' + esc(name) + "</p></div>";
    } else if (q.type === "pick") {
      h += '<div class="choices' + cls + '">' + q.choices.map(function (c, i) {
        var ans = c.id === q.target;
        return '<button type="button" class="kcard' + (ans ? " answer" : "") + '" data-k="tap" data-id="' + c.id + '" data-pos="' + i + '" aria-label="Photo ' + (i + 1) + '">' + sceneSVG(c.photo.scene) + (ans && st.phase === "ack" ? '<span class="tick">' + I.check + "</span>" : "") + "</button>";
      }).join("") + "</div>";
    } else {
      h += '<div class="group' + cls + '"><div class="group-photo">' + sceneSVG(q.photo.scene) + q.photo.faces.map(function (f, i) {
        return '<button type="button" class="face' + (f.personId === q.target ? " answer" : "") + '" style="left:' + f.x + "%;top:" + (f.y + 2) + '%" data-k="tap" data-id="' + f.personId + '" data-pos="' + i + '" aria-label="Person ' + (i + 1) + '"></button>';
      }).join("") + "</div></div>";
    }
    h += "</div>";
    if (q.type === "say") {
      h += '<div class="parent-strip"><span>For you: did he say it?</span><button type="button" class="pbtn yes" data-k="said" data-v="alone">Said it</button><button type="button" class="pbtn" data-k="said" data-v="help">Said it after help</button><button type="button" class="pbtn" data-k="said" data-v="miss">Not yet</button></div>';
    }
    if (st.phase === "celebrate") {
      var stars = [[-340, -140, -12], [340, -130, 14], [-390, 40, 8], [390, 30, -10], [-320, 190, 16], [320, 190, -14], [-180, -235, 6], [180, -235, -6]];
      var pic = q.type === "pick" ? q.choices[q.pos !== undefined ? q.choices.map(function (c) { return c.id; }).indexOf(q.target) : 0].photo : (singlesByPerson()[q.target] || [q.photo])[0];
      h += '<div class="celebrate" role="status"><div class="cele-card">' + sceneSVG(pic.scene) + '</div><p class="cele-text">Yes! ' + esc(name) + "!</p>" +
        stars.map(function (s, i) { return '<span class="star" style="--dx:' + s[0] + "px;--dy:" + s[1] + "px;--r:" + s[2] + "deg;animation-delay:" + (i * 60) + 'ms">' + I.star + "</span>"; }).join("") + "</div>";
    }
    return h;
  }
  function kRender() { var el = document.getElementById("kscreen"); if (el) el.innerHTML = kidScreen(); }
  function kStart() {
    var st = K.st;
    st.level = parseInt((document.getElementById("k-level") || {}).value || st.level, 10);
    st.total = D.who.levels[st.level].questions;
    st.screen = "q"; st.qIndex = 0; st.results = []; st.lastTarget = null; st.lastPos = [];
    kNext(true);
  }
  function kNext(full) {
    var st = K.st; K.clear();
    if (st.qIndex >= st.total) { kFinish(); return; }
    st.q = WhoExercise.build(st.level);
    st.lastTarget = st.q.target; st.phase = "ask"; st.wrong = false; st.notYet = false;
    if (full) render(); else kRender();
    say(WhoExercise.text(st.q));
    K.later(kHelp, D.who.helpDelay * 1000);
  }
  function kHelp() { var st = K.st; if (st.phase !== "ask") return; st.phase = "help"; kRender(); if (st.q.type === "say") say(personName(st.q.target)); }
  function kRecord(outcome) { var st = K.st; st.results.push({ ex: "who", person: st.q.target, outcome: outcome, pos: st.q.pos != null ? st.q.pos : 0, n: st.q.type === "pick" ? st.q.choices.length : 0 }); }
  function kAdvance(ms) { K.later(function () { K.st.qIndex++; kNext(); }, ms); }
  function kCelebrate() { K.clear(); kRecord("alone"); K.st.phase = "celebrate"; kRender(); say("Yes! " + personName(K.st.q.target) + "!"); kAdvance(2600); }
  function kAck(outcome) { K.clear(); kRecord(outcome); K.st.phase = "ack"; kRender(); say((K.st.notYet ? "That’s " : "Yes, ") + personName(K.st.q.target)); kAdvance(1600); }
  function kFinish() {
    var st = K.st; st.screen = "done"; kRender(); say("All done!");
    var r = st.results;
    D.sessions.forEach(function (s) { s.isNew = false; });
    D.sessions.push({ date: "Today", ex: "who", level: st.level, total: r.length, alone: r.filter(function (x) { return x.outcome === "alone"; }).length, help: r.filter(function (x) { return x.outcome === "help"; }).length, miss: r.filter(function (x) { return x.outcome === "miss"; }).length, isNew: true });
    D.trials = D.trials.concat(r);
  }

  /* ---------- Render ---------- */
  function render() {
    var r = UI.route;
    if (r === "play") { root.innerHTML = kidShell(); bindLock(); return; }
    var body;
    if (r.indexOf("photo-") === 0) body = viewLabel();
    else if (r === "photos") body = viewPhotos();
    else if (r === "people") body = viewPeople();
    else if (r === "exercises") body = viewExercises();
    else if (r === "ex-who") body = viewWho();
    else if (r === "progress") body = viewProgress();
    else body = viewHome();
    root.innerHTML = siteShell(body);
    if (UI.newPersonFor !== null) { var np = document.getElementById("np-input"); if (np) np.focus(); }
  }

  /* ---------- Parent lock (press and hold) ---------- */
  function bindLock() {
    var lock = document.getElementById("lock"), t = null;
    if (!lock) return;
    function end() { lock.classList.remove("holding"); clearTimeout(t); }
    lock.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      lock.classList.add("holding");
      t = setTimeout(function () { end(); K.stop(); go(K.st && K.st.screen === "done" ? "progress" : "home"); }, 2000);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (n) { lock.addEventListener(n, end); });
    lock.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }

  /* ---------- Events ---------- */
  root.addEventListener("click", function (e) {
    var k = e.target.closest("[data-k]");
    if (k && K.st) {
      var act = k.getAttribute("data-k"), st = K.st;
      if (act === "start") { kStart(); return; }
      if (act === "speak") { say(WhoExercise.text(st.q)); return; }
      if (st.screen !== "q" || st.phase === "ack" || st.phase === "celebrate") return;
      if (act === "tap") {
        if (k.getAttribute("data-id") === st.q.target) { if (st.phase === "ask" && !st.wrong) kCelebrate(); else kAck(st.wrong ? "miss" : "help"); }
        else { st.wrong = true; K.clear(); st.phase = "help"; kRender(); say(WhoExercise.text(st.q)); }
        return;
      }
      if (act === "said") {
        var v = k.getAttribute("data-v");
        if (v === "alone") kCelebrate(); else if (v === "help") kAck("help"); else { st.notYet = true; kAck("miss"); }
      }
      return;
    }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var a = el.getAttribute("data-action"), d = UI.draft, i = parseInt(el.getAttribute("data-i"), 10);
    if (a === "filter") { UI.filter = el.getAttribute("data-f"); render(); return; }
    if (a === "tap") {
      if (!d.count) { toast("First choose how many people are in the photo."); return; }
      if (d.faces.length >= d.count) { toast("All faces are tapped. Tap a number to remove it."); return; }
      var r = el.getBoundingClientRect();
      d.faces.push({ x: Math.round(Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100)) * 10) / 10, y: Math.round(Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100)) * 10) / 10, personId: null, action: "" });
      render(); return;
    }
    if (a === "remove-face") { d.faces.splice(i, 1); UI.newPersonFor = null; render(); return; }
    if (a === "count") { d.count = parseInt(el.getAttribute("data-n"), 10); if (d.faces.length > d.count) d.faces = d.faces.slice(0, d.count); d.off = {}; render(); return; }
    if (a === "assign") { var pid = el.getAttribute("data-p"); d.faces[i].personId = d.faces[i].personId === pid ? null : pid; render(); return; }
    if (a === "new-person") { UI.newPersonFor = UI.newPersonFor === i ? null : i; render(); return; }
    if (a === "add-person-face") {
      var inp = document.getElementById("np-input"), nm = inp ? inp.value.trim() : "";
      if (!nm) { toast("Type a name first."); if (inp) inp.focus(); return; }
      var np = { id: uid(), name: nm, look: "other", voice: "none" }; D.people.push(np);
      d.faces[i].personId = np.id; UI.newPersonFor = null; render(); toast(nm + " added to People"); return;
    }
    if (a === "save") {
      for (var x = 0; x < D.photos.length; x++) if (D.photos[x].id === d.id) D.photos[x] = d;
      var ok = usage(d).complete; UI.draft = null; go("photos");
      toast(ok ? "Saved to Google Drive" : "Saved. This photo still needs labels."); return;
    }
    if (a === "delete") { UI.confirmDelete = true; render(); return; }
    if (a === "delete-no") { UI.confirmDelete = false; render(); return; }
    if (a === "delete-yes") { D.photos = D.photos.filter(function (p) { return p.id !== d.id; }); UI.draft = null; go("photos"); toast("Deleted from Google Drive"); return; }
    if (a === "voice") {
      var pr = person(el.getAttribute("data-p"));
      if (pr.voice === "rec") { pr.voice = "done"; toast(pr.name + "’s name recorded"); } else pr.voice = "rec";
      render(); return;
    }
    if (a === "add-person") {
      var m = document.getElementById("np-main"), name = m ? m.value.trim() : "";
      if (!name) { toast("Type a name first."); if (m) m.focus(); return; }
      D.people.push({ id: uid(), name: name, look: "other", voice: "none" }); render(); toast(name + " added. Now add photos of them."); return;
    }
  });
  root.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var target = e.target.id === "np-input" ? '[data-action="add-person-face"]' : e.target.id === "np-main" ? '[data-action="add-person"]' : null;
    if (target) { var b = root.querySelector(target); if (b) b.click(); }
  });
  root.addEventListener("input", function (e) {
    var t = e.target;
    if (!UI.draft) return;
    if (t.hasAttribute("data-face-action")) UI.draft.faces[parseInt(t.getAttribute("data-face-action"), 10)].action = t.value;
    if (t.hasAttribute("data-draft")) UI.draft[t.getAttribute("data-draft")] = t.value;
  });
  root.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "file-input") {
      var files = Array.prototype.slice.call(t.files || []);
      if (!files.length) return;
      var added = files.map(function (f) { var p = { id: "u" + uid(), kind: "own", src: URL.createObjectURL(f), title: f.name, count: null, faces: [], place: "", things: "", off: {} }; D.photos.unshift(p); return p; });
      UI.filter = "all";
      if (added.length === 1) { go("photo-" + added[0].id); toast("Photo added. Now label it."); } else { render(); toast(added.length + " photos added. Tap each one to label it."); }
      return;
    }
    if (t.hasAttribute("data-use") && UI.draft) { UI.draft.off[t.getAttribute("data-use")] = !t.checked; return; }
    if (t.id === "cur-level") { D.who.level = parseInt(t.value, 10); render(); return; }
    if (t.id === "help-delay") { D.who.helpDelay = parseInt(t.value, 10); toast("Help now appears after " + t.value + " seconds"); return; }
    if (t.id === "k-level") { K.st.level = parseInt(t.value, 10); kRender(); return; }
    if (t.hasAttribute("data-level")) {
      var L = D.who.levels[t.getAttribute("data-level")], f = t.getAttribute("data-field");
      if (f === "on") L.on = t.checked; else if (f === "layout" || f === "ask") L[f] = t.value; else L[f] = parseInt(t.value, 10);
      render();
    }
  });

  window.addEventListener("hashchange", onRoute);

  /* Fixed kid states, used to make screenshots. */
  window.__mock = {
    kid: function (o) {
      K.setup(); UI.route = "play";
      var st = K.st; st.level = o.level; st.total = D.who.levels[o.level].questions; st.screen = o.screen || "q"; st.qIndex = o.qIndex || 0; st.phase = o.phase || "ask";
      if (o.q) st.q = o.q(photoById);
      root.innerHTML = kidShell(); bindLock();
    }
  };

  onRoute();
})();
</script>
